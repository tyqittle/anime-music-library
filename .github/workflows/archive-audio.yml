name: Archive licensed audio into repository
on:
  push:
    paths:
      - '.github/workflows/archive-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install audio metadata checker
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download and verify complete audio files
        run: python3 scripts/archive_audio.py
      - name: Commit successfully archived tracks and migration report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/ data/tracks.json data/migration-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified full audio files in repository"
            git push
          fi
